plugins {
    id 'com.android.application'
}

def media3Version = '1.5.1'

// release 签名凭据从 keystore.properties 读取（该文件不入库，见 .gitignore）；
// 文件缺失时退化为不签名，保证他人 clone 后仍能构建 debug
def ksPropsFile = rootProject.file('keystore.properties')
def ksProps = new Properties()
if (ksPropsFile.exists()) {
    ksProps.load(new FileInputStream(ksPropsFile))
}

android {
    namespace 'com.lctechgroup.imgbrowser'
    compileSdk 35
    buildToolsVersion '35.0.1'

    signingConfigs {
        if (ksPropsFile.exists()) {
            release {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    defaultConfig {
        // debug/日常构建用 imgbrowser；release 脚本传 -PpkgRelease 时用正式包名 imagebrowser，
        // 两者包名不同，可在同一台设备并存安装、数据互不干扰
        applicationId project.hasProperty('pkgRelease')
                ? 'com.lctechgroup.imagebrowser'
                : 'com.lctechgroup.imgbrowser'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 让 javac 过时 API 警告带具体文件和行号，便于核对是否为自有代码
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += ['-Xlint:deprecation']
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksPropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    // 显式对齐新版注解库，消除 media3 引用 RestrictTo.Scope.LIBRARY_GROUP 的枚举常量警告
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation "androidx.media3:media3-exoplayer:${media3Version}"
    implementation "androidx.media3:media3-ui:${media3Version}"
    implementation "androidx.media3:media3-datasource:${media3Version}"
    implementation "androidx.media3:media3-extractor:${media3Version}"
}
